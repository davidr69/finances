<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<title>Entities</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" th:href="@{./favicon.ico}"/>
	<link rel="stylesheet" type="text/css" th:href="@{./font-awesome-4.7.0/css/font-awesome.min.css}">
	<link rel="stylesheet" type="text/css" th:href="@{./css/common.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{./css/table.css}" />

	<script type="text/javascript" th:src="@{./js/common.js}"></script>
	<script th:insert="~{nav :: required}" th:remove="tag"></script>

	<style>
	.entities {
		border: 0;
		border-spacing: 0;
	}
	</style>

	<script type="module">
		const entitiesJS = './js/entities.js';
		const { default: Entities } = await import(entitiesJS);
		new Entities();
	</script>
</head>
<body>

<div th:insert="~{nav :: menu}"></div>

<form action="entities" method="POST">
<table class="mytable entities">
	<caption style="display: none;">Entities</caption>
	<thead>
		<tr>
			<th scope="col">Entity</th>
			<th scope="col">RAG</th>
			<th scope="col">Account number</th>
			<th scope="col">Address</th>
			<th scope="col">&nbsp;</th>
		</tr>
	</thead>
	<tbody>
		<tr th:each="entity:${entityList}">
			<td th:switch="${entity.validated}">
				<span th:case="true" th:text="${entity.description}" th:remove="tag"></span>
				<span
					style="color: #a00000"
					th:case="false"
					th:data-id="${entity.id}"
					th:with=
						"deleteIcon=${'&nbsp;&nbsp;&nbsp;<i class=''fa fa-trash small-glyph''></i>'},
						  checkIcon=${'&nbsp;&nbsp;&nbsp;<i class=''fa fa-check small-glyph''></i>'}"
					th:utext="${entity.description + deleteIcon + checkIcon}">
				</span>
			</td>
			<td><label>
				<input type="text" size="32" maxlength="32" th:data-rag="${entity.id}" th:id="'input' + ${entity.id}" th:value="${entity.aliases}"/>
			</label>&nbsp;&nbsp;<i th:id="'rag' + ${entity.id}"></i>&nbsp;&nbsp;&nbsp;</td>
			<td th:text="${entity.account}"></td>
			<td th:text="${entity.address}"></td>
			<td>&nbsp;</td>
		</tr>
		<tr>
			<td><label>
				<input type="text" size="32" maxlength="64" name="description" required="required"/>
			</label></td>
			<td>&nbsp;</td>
			<td><label>
				<input type="text" size="25" maxlength="25" name="account"/>
			</label></td>
			<td><label>
				<input type="text" size="32" maxlength="128" name="address"/>
			</label></td>
			<td><input type="submit" value=" add this "/></td>
		</tr>
	</tbody>
</table>
</form>

</body>
</html>
